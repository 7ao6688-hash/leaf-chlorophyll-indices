[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leaf-chlorophyll-indices"
version = "1.0.0"
description = "Evaluate Sentinel-2 vegetation indices against measured leaf and canopy chlorophyll"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Xiaoqiao Liu"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "openpyxl>=3.1", "matplotlib>=3.7"]

[project.scripts]
chlorophyll-indices = "chlorophyll_indices.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
